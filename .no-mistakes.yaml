agent: codex
agent_args_override:
  codex:
    - -m
    - gpt-6.1-sol
    - -c
    - model_reasoning_effort="medium"
no_ci: true
pr:
  base_branch: main
providers:
  github:
    draft_pull_requests: false
commands:
  prepare: 'node scripts/isolated.ts corepack pnpm install --offline --frozen-lockfile --ignore-scripts --config.confirm-modules-purge=false'
  test: 'corepack pnpm test'
  lint: 'node scripts/isolated.ts corepack pnpm run lint'
document:
  instructions: |
    README.md owns onboarding, group coverage and concise safety/configuration summaries.
    docs/commands.md and skills/hybrid-axi/SKILL.md own generated leaf-command reference.
    docs/behavior.md, docs/configuration.md, docs/safety.md and docs/agent-integration.md own detailed usage contracts.
    CONTRIBUTING.md owns contribution, development commands, releases and practical testing rules.
    docs/design.md owns architecture, safety invariants, operation classifications and implementation slices.
    inventory/specs.json owns source URLs, versions and byte hashes; specs/ holds unmodified snapshots.
    scripts/specs.ts owns offline declaration and inventory/capabilities.json generation from specs and the design ledger.
    src/generated/ and inventory/capabilities.json are generated; never edit them manually.
    src/catalogue.ts owns executable commands and help; inventory evidence never grants execution.
    src/cli.ts owns dispatch and the AXI output boundary; bin/ owns executable launch and the version fast path.
    scripts/isolated.ts owns disposable HOME/XDG/agent state and offline dependency-cache reuse.
    scripts/test-changes.ts owns affected-test selection and the fixed critical baseline.
    test/ owns observable CLI and transport behavior against synthetic fixtures and our fake upstream.
    package.json owns development commands and packaging; .no-mistakes.yaml owns validation policy.
    tsconfig.json owns strict compilation; vitest.config.ts owns test discovery and the network preload.
test:
  instructions: |
    HARD RULE: never contact hybrid-analysis.com or any live service and never provision services.
    Validate offline using synthetic credentials, fixtures and our own fake upstream only.
    Drive the packed CLI version/help/home and rejected-input journeys with the inherited network guard.
    Use affected tests plus the fixed baseline; shared infrastructure changes require the full suite.
    Review all evidence for private data before publishing it in this PUBLIC repository.
review:
  path_instructions:
    - path: "**"
      instructions: |
        This repository is PUBLIC. Reject credentials, actual API responses, customer data, employer names,
        private hosts, usernames, private paths and internal tool names. Use public sources and synthetic examples.
        Never commit .pi/ scratch files. Never hand-edit generated files or CHANGELOG.md.
        HARD RULE: review and test steps never contact hybrid-analysis.com or any live service,
        and never provision services. Use offline checks and our own synthetic fake upstream only.
        Credentials use env/file SecretRefs only, default HYBRID_AXI_API_KEY, never argv, and are scrubbed on every channel.
        Submissions, YARA create/update/delete, consuming matches and guarded sample/memory downloads
        require preview, --execute and exact --confirm. Submission previews disclose community visibility.
        Download preview/help includes the live-malware warning and unverified gzip/ZIP protection.
        Quick scans are reads that still send supplied data. Labs is experimental; unknown fields pass through.
    - path: "**"
      instructions: >-
        Test quality: apply the "Test quality" rules in CONTRIBUTING.md to every added or changed test.
        Flag each violation as a finding naming the rule number, the test file:line and the evidence.
        Respect the listed exemptions. Never ask for a test to be written first or only to raise coverage.
    - path: "inventory/**"
      instructions: |
        Classify each pinned method/path exactly once with source hash and evidence.
        The 62-operation ledger is evidence only. New or unbound operations remain blocked at runtime.
    - path: "src/**/credential*"
      instructions: |
        Keys come only from strict env/file SecretRefs. The default env name is exactly HYBRID_AXI_API_KEY.
        Never accept inline keys, argv credentials, arbitrary headers or repository-local discovery.
        Preserve private-file ownership/ACL checks and reject control characters before composing headers.
        Scrub raw, JSON-escaped and URL-encoded keys on every channel before any dependency sees them.
    - path: "src/**/profile*"
      instructions: |
        Reject partial env profiles and unknown keys. File profiles never mix env fields.
        Env profiles cannot enable writes. The origin is exactly https://hybrid-analysis.com.
        HYBRID_AXI_READ_ONLY overrides configured write permission.
    - path: "src/**/private*"
      instructions: |
        Require private regular files, no symlinks/reparse points, current ownership and protected Windows DACLs.
        Private writes are atomic and flushed; test platform boundaries offline.
    - path: "src/**/redact*"
      instructions: |
        Scrub keys, raw/escaped/encoded forms and sensitive field names on stdout, stderr, errors,
        previews, suggestions, headers, filenames, paths and journal metadata. Use synthetic sentinels.
        Omit /key/current api_key and user information even under --full. Redact unknown Labs fields.
        Do not rewrite binary bytes or persist keys/full response bodies in journals.
    - path: "src/**/transport*"
      instructions: |
        Keep one HTTPS sink with explicit operation/method/path bindings, TLS verification and redirect:error.
        Only this sink composes api-key. Validate origin, paths, identifiers and continuations before attaching keys.
        Permit only https://hybrid-analysis.com/api/v2 and /api/labs; no BFF, arbitrary HTTP or caller URLs.
        Bound bytes, requests and deadlines. Never replay ambiguous timeouts, quick scans, search starts or writes.
        Translate upstream errors without raw bodies or stack traces; denial/malformed data never means empty.
    - path: "src/**/session*"
      instructions: |
        Preserve operation binding, bounded transport and tolerant runtime decoding.
        Quick scans are reads but send the supplied sample or URL; disclose transmission in help.
        Labs is experimental; unknown fields pass through decoding and remain available via --fields/--full after redaction.
    - path: "src/**/write*"
      instructions: |
        Submissions, YARA create/update/delete, consuming matches and guarded sample/memory downloads
        require immutable allowlists, preview, --execute and exact --confirm. Default/forced read-only denies sends.
        Persist redacted intent before one send; journal failure blocks it. Never replay ambiguous outcomes.
        Submission previews state: The sample and its report can become visible to the community.
        Consuming-match previews describe the exact scope and delivered-state effect without calling the endpoint.
        Download preview and help carry: Live-malware warning: this artifact may contain executable malware.
        Save only; do not extract or execute. Gzip/ZIP protection is unverified; save bytes exactly as provided.
    - path: "src/**/catalogue*"
      instructions: |
        Help and effects follow pinned specs. Submissions, YARA mutations, consuming matches and guarded
        sample/memory downloads need preview, --execute and exact --confirm. Quick scans are reads that send data.
        Labs help says experimental and unknown response fields pass through. Download help carries the
        live-malware warning and unverified password protection; submission preview states community visibility.
auto_fix:
  review: 1
  test: 3
  lint: 0
